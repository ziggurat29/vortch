<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- AI / circuit brain (traced from PCB-brain ref). Side profile of traces +
       nodes; electricity travels the traces. In-app: procedural (dash-offset
       flow + node pulse); CSS below is browser-preview only. -->
  <style>
    .pulse { stroke-dasharray: 6 62; animation: flow 1.4s linear infinite; }
    .p2 { animation-duration: 1.9s; animation-delay: .3s; }
    .p3 { animation-duration: 1.05s; animation-delay: .6s; }
    @keyframes flow { from { stroke-dashoffset: 68; } to { stroke-dashoffset: 0; } }
    .node { animation: tw 1.6s ease-in-out infinite; }
    .n2 { animation-delay: .4s; } .n3 { animation-delay: .8s; } .n4 { animation-delay: 1.1s; }
    @keyframes tw { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <clipPath id="bshape">
      <path d="M22,66 C12,62 10,48 18,42 C16,30 26,24 34,28 C38,20 48,20 52,27
               C57,21 68,22 71,30 C80,30 84,40 78,47 C82,50 82,58 75,59
               C74,66 66,71 60,66 C55,71 44,70 40,64 C34,70 26,70 22,66 Z"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#04121a" fill-opacity="0.62"/>

  <g clip-path="url(#bshape)">
    <rect x="0" y="0" width="100" height="100" fill="#061a24"/>
    <!-- dim base traces -->
    <g fill="none" stroke="#1f7f96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18,50 H34 V38 H48"/>
      <path d="M30,62 V48 H44 V34"/>
      <path d="M50,64 V52 H64 V40 H76"/>
      <path d="M40,30 V44 H56 V56"/>
      <path d="M60,28 H72 V46"/>
      <path d="M22,44 H34"/>
      <path d="M64,52 H74"/>
    </g>
    <!-- nodes -->
    <g fill="#5fd0e6">
      <circle cx="34" cy="38" r="2"/><circle cx="48" cy="38" r="2"/>
      <circle cx="44" cy="34" r="2" class="node"/><circle cx="64" cy="40" r="2"/>
      <circle cx="76" cy="40" r="2" class="node n2"/><circle cx="56" cy="56" r="2" class="node n3"/>
      <circle cx="72" cy="46" r="2"/><circle cx="30" cy="62" r="2" class="node n4"/>
      <circle cx="18" cy="50" r="2"/><circle cx="60" cy="28" r="2"/>
      <circle cx="40" cy="30" r="2" class="node n2"/>
    </g>
    <!-- electric pulses travelling the traces -->
    <g fill="none" stroke="#eafcff" stroke-width="2" stroke-linecap="round">
      <path class="pulse"    d="M18,50 H34 V38 H48"/>
      <path class="pulse p2" d="M50,64 V52 H64 V40 H76"/>
      <path class="pulse p3" d="M40,30 V44 H56 V56"/>
    </g>
  </g>

  <!-- glowing brain outline -->
  <path fill="none" stroke="#46c9e6" stroke-width="2.4" stroke-linejoin="round"
        d="M22,66 C12,62 10,48 18,42 C16,30 26,24 34,28 C38,20 48,20 52,27
           C57,21 68,22 71,30 C80,30 84,40 78,47 C82,50 82,58 75,59
           C74,66 66,71 60,66 C55,71 44,70 40,64 C34,70 26,70 22,66 Z"/>
</svg>
