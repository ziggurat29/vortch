<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Side-view woodcut brain (traced from hand-drawn ref). Pink fill, bold ink
       outline + hatched sulci + cerebellum fan. In-app: procedural 'throb'
       (normal + frenetic rates); CSS below is browser-preview only. -->
  <style>
    .brain { transform-origin: 50px 50px; animation: throb 1.2s ease-in-out infinite; }
    @keyframes throb { 0%,100% { transform: scale(1);    opacity: .92 }
                        50%     { transform: scale(1.08); opacity: 1   } }
  </style>
  <circle cx="50" cy="50" r="47" fill="#2a0d1c" fill-opacity="0.5"/>
  <g class="brain">
    <!-- silhouette -->
    <path fill="#ff7ab8" stroke="#3a1024" stroke-width="3" stroke-linejoin="round"
          d="M22,66 C12,62 10,48 18,42 C16,30 26,24 34,28 C38,20 48,20 52,27
             C57,21 68,22 71,30 C80,30 84,40 78,47 C82,50 82,58 75,59
             C74,66 66,71 60,66 C55,71 44,70 40,64 C34,70 26,70 22,66 Z"/>
    <!-- lateral sulcus + gyri, woodcut linework -->
    <g fill="none" stroke="#3a1024" stroke-width="1.7" stroke-linecap="round">
      <path d="M22,53 C36,50 52,54 68,49"/>
      <path d="M24,44 C31,41 38,44 44,40"/>
      <path d="M47,35 C53,32 60,35 66,33"/>
      <path d="M30,58 C38,55 46,58 54,55"/>
      <path d="M52,44 C58,41 64,44 70,42"/>
      <!-- short hatch ticks along a gyrus -->
      <path d="M28,47 l2,-3 M34,45 l2,-3 M40,46 l2,-3 M50,40 l2,-3 M58,39 l2,-3" stroke-width="1.3"/>
    </g>
    <!-- cerebellum fan (lower right) -->
    <g fill="none" stroke="#3a1024" stroke-width="1.4" stroke-linecap="round">
      <path d="M62,60 C66,62 69,64 70,60"/>
      <path d="M61,63 C65,65 68,66 70,63"/>
      <path d="M61,66 C64,68 67,68 69,66"/>
    </g>
    <!-- brainstem nub -->
    <path fill="#ff7ab8" stroke="#3a1024" stroke-width="2.5" stroke-linejoin="round"
          d="M52,66 C52,72 50,76 54,78 C58,76 57,71 57,66 Z"/>
  </g>
</svg>
